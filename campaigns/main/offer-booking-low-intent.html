<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<body>

  <!-- ── STICKY BANNER ────────────────────────────────────────────────────── -->
  <div class="vsl-banner vsl-banner--sticky">
    <img class="vsl-banner-logo" src="../../shared/logo-white.svg" alt="Iota Media" />
  </div>

  <!-- ── BOOKING PAGE (video on top, no thank-you hero) ──────────────────────── -->
  <div class="vsl-wrapper">

    <!-- Recruiting strategy video -->
    <div class="results-section" style="border-top:none;padding-top:0;">
      <h3 class="results-section__heading">Watch the first 5 mins of this video before booking!</h3>
      <div class="video-outer" style="margin-top:1rem;">
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/1ovtoJr6zsU?controls=0&rel=0" allow="fullscreen" allowfullscreen title="Our full recruiting strategy"></iframe>
        </div>
      </div>
    </div>

    <!-- Calendar — always visible -->
    <div class="calendar-section calendar-section--always-visible" id="calendar-section">
      <h3>Book your free discovery session here</h3>
      <p>Choose a time that works for you.</p>

      <div class="calendar-embed-wrap" id="calendar-embed-wrap">
        <div class="calendar-placeholder" id="calendar-placeholder">
          <strong>&#128197; Calendar Embed</strong>
          <span>Set <code>integrations.calendarEmbedUrl</code> in config.js</span>
        </div>
        <!-- Iframe injected by init script -->
      </div>
    </div>

  </div><!-- /vsl-wrapper -->

  <script>
    (function () {
      // Inject calendar if URL is set
      var calUrl = CONFIG.integrations.calendarEmbedUrl;
      if (calUrl) {
        var calPlaceholder = document.getElementById("calendar-placeholder");
        if (calPlaceholder) calPlaceholder.remove();

        var wrap = document.getElementById("calendar-embed-wrap");
        var calIframe = document.createElement("iframe");
        calIframe.src = calUrl;
        calIframe.style.width = "100%";
        calIframe.style.border = "none";
        calIframe.style.overflow = "hidden";
        calIframe.style.display = "block";
        calIframe.scrolling = "no";
        wrap.appendChild(calIframe);

        var calScript = document.createElement("script");
        calScript.src = "https://system.iotacompany.com/js/form_embed.js";
        calScript.type = "text/javascript";
        document.body.appendChild(calScript);
      }
    })();
  </script>
</body>
</html>
